name: Retrieve Zotero bibliography

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: zotero-bibliography
  cancel-in-progress: false

jobs:
  update_bibtex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - name: Test bibliography reconciliation
        run: uv run --no-project --python 3.11 --with pytest --with bibtexparser==1.4.3 python -m pytest tests/test_bibliography.py -q --disable-warnings
      - name: Retrieve and validate bibliography
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: |
          test -n "$ZOTERO_API_KEY" || { echo "Missing ZOTERO_API_KEY secret"; exit 1; }
          uv run --no-project --python 3.11 --with bibtexparser==1.4.3 python scripts/update_bibliography.py --report bibliography-report.json
      - name: Upload retrieval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bibliography-report
          path: bibliography-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Open or update bibliography pull request
        id: bibliography_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: references.bib
          base: main
          branch: automation-zotero-bibliography
          delete-branch: true
          commit-message: "chore: retrieve Zotero bibliography"
          title: "Update Zotero bibliography"
          body: |
            Refresh the shared Zotero bibliography while preserving existing citation keys.

            The retrieval report is available in the bibliography workflow artifacts.
            Auto-merge is enabled; GitHub merges after the required review,
            LaTeX checks, and branch protections are satisfied.
      # Explicit dispatch ensures checks run for a PR created with GITHUB_TOKEN.
      - name: Run LaTeX checks on the bibliography branch
        if: >-
          steps.bibliography_pr.outputs.pull-request-operation == 'created' ||
          steps.bibliography_pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation-zotero-bibliography
          PR_URL: ${{ steps.bibliography_pr.outputs.pull-request-url }}
        run: |
          gh workflow run latex.yml --ref "$UPDATE_BRANCH"
          echo "Bibliography update proposed: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable auto-merge for the bibliography pull request
        if: steps.bibliography_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.bibliography_pr.outputs.pull-request-url }}
        run: |
          PR_HEAD=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$PR_HEAD"

name: Retrieve Zotero bibliography

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zotero-bibliography
  cancel-in-progress: false

jobs:
  update_bibtex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test bibliography reconciliation
        run: uv run --no-project --python 3.11 --with pytest --with bibtexparser==1.4.3 python -m pytest tests/test_bibliography.py -q --disable-warnings
      - name: Retrieve and validate bibliography
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: |
          test -n "$ZOTERO_API_KEY" || { echo "Missing ZOTERO_API_KEY secret"; exit 1; }
          uv run --no-project --python 3.11 --with bibtexparser==1.4.3 python scripts/update_bibliography.py --report bibliography-report.json
      - name: Upload retrieval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bibliography-report
          path: bibliography-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit bibliography only when changed
        run: |
          if git diff --quiet -- references.bib; then
            echo "Bibliography unchanged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add references.bib
          git -c core.hooksPath=/dev/null commit -m "chore: retrieve Zotero bibliography"
          git push
          echo "Updated references.bib from Zotero" >> "$GITHUB_STEP_SUMMARY"
